<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Tracker | Dashboard</title>
  <meta name="description" content="Manage and track your projects">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-mesh"></div>
  
  <div class="container">
    <header class="tracker-header">
      <div>
        <h1 class="text-gradient">Project Tracker</h1>
        <p style="color: var(--text-secondary); margin-top: 4px;">Manage tasks, tracking, and WBS</p>
      </div>
      <div style="display: flex; gap: 12px;">
        <button id="exportBtn" class="btn btn-outline">Export CSV</button>
        <button id="refreshBtn" class="btn btn-outline">Refresh</button>
        <button id="logoutBtn" class="btn glass-panel" style="background: var(--card-bg); color: var(--text-primary); font-weight: 500;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Lock
        </button>
      </div>
    </header>

    <!-- KPI Cards -->
    <div class="kpi-grid">
      <div class="glass-panel kpi-card">
        <span class="kpi-title">Total Tasks</span>
        <span class="kpi-value" id="kpiTotal">0</span>
        <span class="kpi-subtext" id="kpiTotalSub">0 in motion</span>
      </div>
      <div class="glass-panel kpi-card">
        <span class="kpi-title">Average Progress</span>
        <span class="kpi-value" id="kpiProgress">0%</span>
        <span class="kpi-subtext" id="kpiProgressSub">0 tasks completed</span>
      </div>
      <div class="glass-panel kpi-card">
        <span class="kpi-title">Late Tasks</span>
        <span class="kpi-value" id="kpiLate">0</span>
        <span class="kpi-subtext" id="kpiLateSub">0 due within 7 days</span>
      </div>
      <div class="glass-panel kpi-card">
        <span class="kpi-title">Sheet Status</span>
        <span class="kpi-value" style="font-size: 20px; margin-top: 8px;">Connected</span>
        <span class="kpi-subtext">Google Sheets Sync Active</span>
      </div>
    </div>

    <!-- Main Content -->
    <main>
      <div class="table-controls">
        <div class="filter-group">
          <input type="text" id="searchInput" class="input-control" placeholder="Search tasks..." style="width: 250px;">
          <select id="statusFilter" class="input-control" style="width: 150px;">
            <option value="All">All Status</option>
            <option value="Active">Active</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
        <button id="newTaskBtn" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 6px;">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New Task
        </button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>WBS</th>
              <th>Task</th>
              <th>Lead</th>
              <th>Start</th>
              <th>End</th>
              <th>Progress</th>
              <th>Status</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="projectsContainer">
            <tr>
              <td colspan="8" style="text-align: center; padding: 40px;">
                <div class="loader loader-large"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal-card">
      <h2 id="modalTitle" style="margin-bottom: 20px;">New Task</h2>
      <form id="taskForm">
        <input type="hidden" id="taskId">
        
        <div style="display: flex; gap: 16px;">
          <div class="input-group" style="flex: 1;">
            <label>WBS (ID)</label>
            <input type="text" id="taskWbs" class="input-control" required>
          </div>
          <div class="input-group" style="flex: 2;">
            <label>Lead</label>
            <input type="text" id="taskLead" class="input-control" required>
          </div>
        </div>

        <div class="input-group">
          <label>Task Name</label>
          <input type="text" id="taskName" class="input-control" required>
        </div>

        <div style="display: flex; gap: 16px;">
          <div class="input-group" style="flex: 1;">
            <label>Start Date</label>
            <input type="date" id="taskStart" class="input-control" required>
          </div>
          <div class="input-group" style="flex: 1;">
            <label>End Date</label>
            <input type="date" id="taskEnd" class="input-control" required>
          </div>
        </div>

        <div class="input-group">
          <label>% Done</label>
          <input type="number" id="taskProgress" class="input-control" min="0" max="100" value="0" required>
        </div>

        <div class="input-group" style="margin-top: 16px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label style="margin: 0;">Checkpoints (Sub-tasks)</label>
            <button type="button" id="addCheckpointBtn" class="btn btn-outline" style="padding: 4px 8px; font-size: 12px;">+ Add Checkpoint</button>
          </div>
          <div id="checkpointsContainer" style="display: flex; flex-direction: column; gap: 8px;">
            <!-- Checkpoints injected here -->
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
          <button type="button" class="btn btn-outline" id="closeModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveTaskBtn">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

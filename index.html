<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meedish Tracker | Login</title>
  <meta name="description" content="Login to Meedish Project Tracker">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="bg-mesh"></div>

  <div class="login-wrapper">
    <div class="glass-panel login-card">
      <div class="login-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <div class="login-header">
        <h1 class="text-gradient">Meedish Tracker</h1>
        <p>Enter passcode to access dashboard</p>
      </div>

      <form id="loginForm">
        <div class="input-group">
          <label for="password">Passcode</label>
          <input type="password" id="password" class="input-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span id="loginBtnText">Unlock Dashboard</span>
          <span id="loginLoader" class="loader" style="display: none;"></span>
        </button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
